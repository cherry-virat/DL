# Render Infrastructure-as-Code Blueprint
# Brain MRI 3D Classification and Segmentation Application
services:
  - type: web
    name: brain-tumor-segmentation-api
    runtime: python
    region: oregon
    plan: standard # 2 GB+ RAM recommended for 3D MRI volume array operations
    buildCommand: pip install -r requirements-deploy.txt && python scripts/download_weights.py
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: TORCH_DEVICE
        value: cpu # Standard Render cloud tiers use CPU inference
      - key: API_RUNS_DIR
        value: outputs/api_runs
    autoDeploy: false
